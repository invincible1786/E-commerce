<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
</head>
<body>
    <div class="container">
        <div class="heading">TODO-APP</div>
        <form id="todoform">
            <input type="text" id="todoinput" placeholder="Whatcha u upto ?" required>
            <button id="sub" type="submit">SUBMIT</button>
        </form>
        <ul id="todolist"></ul>
    </div>
</body>
<script>
    const btn = document.getElementById("sub");
    const input = document.getElementById("todoinput");
    const list = document.getElementById("todolist");

    const API = "http://localhost:3000/todos";

    async function fetch_todo() {
        try {
            const response = await fetch(API);
            const todos = await response.json();
            return todos;
        }
        catch (error) {
            console.log("Failed to fetch the todos:", error);
            return [];
        }
    }

    async function toggleTodo(id) {
        try {
            await fetch(`${API}/${id}`, {
                method: 'PATCH',
            });
            render_todo(); 
        } catch (error) {
            console.error("Can't update the todo status", error);
        }
    }

    async function deleteTodo(id){
        try {
            await fetch(`${API}/${id}`, {
            method: 'DELETE'
        });
        render_todo();
        } catch (error) {
            console.error("Can't delete the todo");
        }     
    }


    async function render_todo(){
        const todos = await fetch_todo();
        list.innerHTML = "";

        if(todos.length === 0) list.innerHTML = "Machax !!";

        else{
            todos.forEach(ele => {
                const item = document.createElement('li')

                const tt = document.createElement('span');
                tt.textContent = ele.title; 
                if(ele.completed) tt.style.textDecoration = 'line-through';

                const check = document.createElement('input');
                check.type = 'checkbox';
                check.checked = ele.completed;
                check.addEventListener('change', () => toggleTodo(ele.id));

                const bye = document.createElement('button');
                bye.textContent = "Delete";
                bye.addEventListener('click', ()=>deleteTodo(ele.id));

                item.appendChild(check);                
                item.appendChild(tt);                
                item.appendChild(bye);                
                list.appendChild(item);
            });
        }
    }

    btn.addEventListener("click",async (e)=>{
        e.preventDefault();
        const txt = input.value.trim();

        if(txt == ""){
            alert("Title is required");
        }
        else{
            try {
                await fetch(API, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ title: txt })
                });
                render_todo();
                input.value = "";
            } catch (error) {   
                console.error("Failed to add the todo", error);
            }
        }
    })
    render_todo();

</script>
</html>
